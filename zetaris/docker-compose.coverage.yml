# Coverage Detective: mount our processed data read-only into the Zetaris query engine.
#
# Zetaris only reads local files under /home/zetaris/customer-data/shared/ (its
# zetaris_local_file_sytem_root_path); any other local path fails with
# "Invalid file path to access". Apply with scripts/zetaris/compose.sh, which passes this
# file after Zetaris's own docker-compose.yml and sets COVERAGE_DATA_DIR.
services:
  driver:
    volumes:
      - ${COVERAGE_DATA_DIR:?set COVERAGE_DATA_DIR to Coverage_find/data/processed}:/home/zetaris/customer-data/shared/coverage_detective:ro
